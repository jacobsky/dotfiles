onboarding = false

[ui.sound]
enabled = false

[theme]
name = "terminal"

auto_switch = false
[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.spaces]
rows = [
    [
        "state_icon",
        "workspace",
    ],
    [
        "branch",
        "git_status",
    ],
    [
        "$jj_bookmark",
        "$jj_status",
    ],
]
[[keys.command]]
key = "prefix+space"              # or "ctrl+space" for a direct, prefix-free leader
type = "plugin_action"
command = "pradyb.which-key.open"
description = "which-key"
